<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CricTV</title>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<canvas id="particles"></canvas>

<header class="app-header">
  <img src="https://crickettv.site/image/api/crickettv.png" alt="CricTV">
</header>

<main class="container">
  <section class="poster-grid">
    
<div class="poster">
  <img src="https://img10.hotstar.com/image/upload/f_auto,q_90,w_1920/sources/r1/cms/prod/9268/1770563589268-i" alt="South Africa Vs Canada">
  <div class="overlay">
    <h3>South Africa Vs Canada</h3>
    <div class="meta">9 Feb 2026 • 06:45 PM</div>
    
      <a class="btn" href="/t20-worldcup/match-1">Play Highlights</a>
    
  </div>
</div>

<div class="poster">
  <img src="https://img10.hotstar.com/image/upload/f_auto,q_90,w_1920/sources/r1/cms/prod/6053/1770304756053-i" alt="Magic Moments">
  <div class="overlay">
    <h3>Magic Moments</h3>
    <div class="meta">17 Jan 2026 • 12:35 PM</div>
    
      <a class="btn" href="/highlights/rise-of-champion">Play Highlights</a>
    
  </div>
</div>

  </section>
</main>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let w, h;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const particles=[];
for(let i=0;i<45;i++){
  particles.push({
    x:Math.random()*w,
    y:Math.random()*h,
    r:Math.random()*1.4+0.4,
    vx:Math.random()*0.15+0.05,
    vy:Math.random()*0.1+0.03,
    a:Math.random()*0.35+0.15
  });
}

(function animate(){
  ctx.clearRect(0,0,w,h);
  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy;
    if(p.x>w) p.x=0;
    if(p.y>h) p.y=0;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${p.a})`;
    ctx.fill();
  }
  requestAnimationFrame(animate);
})();
</script>

</body>
</html>

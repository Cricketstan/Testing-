<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CricTV</title>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<canvas id="particles"></canvas>

<header class="app-header">
  <img src="https://crickettv.site/image/api/crickettv.png" alt="CricTV">
</header>

<main class="container">
  <section class="poster-grid">
    
<div class="card">
  <img src="https://vmndims.kayosports.com.au/api/v2/img/69426427e4b0d8ef2e159a4c-1766534449696?location=hero-default&imwidth=1920" alt="Sixers Vs Heat">
  <div class="card-content">
    <h3>Sixers Vs Heat</h3>
    <div class="meta">5 Jan 2026 • 01:40 PM</div>
    <div class="meta">BBL • Eng</div>

    <div class="buttons">
      <a href="/home/sixers-vs-heat">All Stream</a>
    </div>
  </div>
</div>

<div class="card">
  <img src="https://img10.hotstar.com/image/upload/f_auto,q_90,w_1920/sources/r1/cms/prod/6963/1767522706963-h" alt="Highlights">
  <div class="card-content">
    <h3>Highlights</h3>
    <div class="meta">1 Jan 2026 • 07:45 PM</div>
    <div class="meta">BBL • Eng</div>

    <div class="buttons">
      <a href="/highlights/BBL">Play Highlights</a>
    </div>
  </div>
</div>

  </section>
</main>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let w, h;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const particles=[];
for(let i=0;i<45;i++){
  particles.push({
    x:Math.random()*w,
    y:Math.random()*h,
    r:Math.random()*1.4+0.4,
    vx:Math.random()*0.15+0.05,
    vy:Math.random()*0.1+0.03,
    a:Math.random()*0.35+0.15
  });
}

(function animate(){
  ctx.clearRect(0,0,w,h);
  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy;
    if(p.x>w) p.x=0;
    if(p.y>h) p.y=0;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${p.a})`;
    ctx.fill();
  }
  requestAnimationFrame(animate);
})();
</script>

</body>
</html>
